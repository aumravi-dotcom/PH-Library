<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prana Life Library</title>
<meta name="theme-color" content="#F3EDFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#FAF8FF; --wash:#F4EEFF; --wash-2:#ECE3FF; --card:#FFFFFF; --line:#E8E0FA; --line-2:#DCCFFB;
  --ink:#2A2245; --muted:#776E96;
  --violet:#7B2FF7; --violet-2:#6420E0; --violet-soft:#F2EBFF; --violet-ink:#5A1FC0;
  --amber:#9C6508; --amber-soft:#FFF4DE;
  --ok:#1F7F55; --ok-soft:#E5F6EE; --bad:#C0364A; --bad-soft:#FDECEF;
  --wa:#1E8E4E;
  --serif:'Spectral', Georgia, 'Times New Roman', serif;
  --sans:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#FAF8FF}
body{min-height:100vh}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:radial-gradient(1100px 520px at 100% -8%, #EFE5FF 0, rgba(239,229,255,0) 62%), radial-gradient(900px 480px at -10% 110%, #F3ECFF 0, rgba(243,236,255,0) 60%), var(--paper);background-attachment:fixed;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--violet-ink);text-underline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:2rem;letter-spacing:-.01em}
h2{font-size:1.22rem}
h3{font-size:1.02rem;margin:1.1rem 0 .45rem}
p{margin:.4rem 0}
.muted{color:var(--muted)} .small{font-size:.84rem} .bad-text{color:var(--bad)}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
[hidden]{display:none!important}

/* layout */
.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#F4EEFF 0%,#EEE5FF 100%);border-right:1px solid var(--line);padding:1.4rem 1rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1.4rem;padding-top:calc(1.4rem + env(safe-area-inset-top,0px));min-width:0}
.brand-name{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.15;color:var(--ink)}
.brand-sub{font-size:.82rem;color:var(--muted);margin-top:.2rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--ink);text-decoration:none;padding:.5rem .7rem;border-radius:9px;display:flex;justify-content:space-between;align-items:center;font-weight:500;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.6)}
.nav a.on{background:#fff;color:var(--violet-ink);border-left-color:var(--violet);box-shadow:0 1px 2px rgba(90,40,180,.08),0 4px 14px -8px rgba(90,40,180,.25)}
.badge{background:var(--violet);color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:0 .45rem;min-width:1.4rem;text-align:center}
.side-foot{margin-top:auto;font-size:.85rem;color:var(--muted)}
.main{padding:1.8rem clamp(1rem,3vw,2.6rem) 4rem;max-width:1200px;width:100%}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.5rem;padding:.75rem 1rem .5rem;padding-top:calc(.75rem + env(safe-area-inset-top,0px));z-index:5;border-right:0;border-bottom:1px solid var(--line)}
  .side .nav{grid-column:1 / -1}
  .brand-sub,.who-name{display:none}
  .side-foot{margin:0;grid-row:1;grid-column:2}
  .nav{flex-direction:row;overflow-x:auto;gap:.2rem;scrollbar-width:none}
  .nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;gap:.4rem}
  .nav a.on{border-bottom-color:var(--violet)}
  h1{font-size:1.65rem}
}
.mhead{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:.85rem clamp(1rem,3vw,2.6rem);padding-top:calc(.85rem + env(safe-area-inset-top,0px));display:flex;gap:.6rem 1.5rem;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.mnav{display:flex;gap:.3rem;flex:1;overflow-x:auto;scrollbar-width:none}
.mnav a{text-decoration:none;color:var(--ink);padding:.42rem .8rem;border-radius:999px;font-weight:500;white-space:nowrap}
.mnav a.on{background:var(--violet-soft);color:var(--violet-ink)}
.mwho{display:flex;gap:.6rem;align-items:center;font-size:.88rem}
.mmain{max-width:1100px;margin:0 auto;padding:1.6rem clamp(1rem,3vw,2.6rem) 4rem}

/* page bits */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.page-head p{margin:.3rem 0 0}
.back{display:inline-block;margin-bottom:.8rem;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem;margin-top:1.25rem;min-width:0;box-shadow:0 1px 0 rgba(123,47,247,.03)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem}
.panel-head .search{max-width:320px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:0 1.25rem}
.empty{color:var(--muted);padding:.4rem 0}
.row{display:flex;gap:.5rem;align-items:center}
.row>input{flex:1}
.wrap{flex-wrap:wrap}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;align-items:center}
.toolbar .search{flex:1;min-width:220px}
.toolbar select,.toolbar input[type=date]{width:auto}
.demo{background:var(--amber-soft);border:1px solid #F3DFB3;border-radius:10px;padding:.55rem .8rem;font-size:.86rem;margin-bottom:1.2rem}

/* controls */
.btn{font:inherit;font-weight:600;font-size:.92rem;border:1px solid transparent;background:var(--violet);color:#fff;padding:.55rem .95rem;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;white-space:nowrap;line-height:1.2;box-shadow:0 6px 16px -10px rgba(123,47,247,.7)}
.btn:hover{background:var(--violet-2)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--violet-soft)}
.btn.wa{background:var(--wa);color:#fff;box-shadow:none}
.btn.wa:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn.sm{padding:.34rem .62rem;font-size:.82rem}
.btn.lg{padding:.75rem 1.25rem;font-size:1rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;color:var(--violet-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:.55rem .7rem;width:100%;min-width:0}
textarea{min-height:5rem;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(123,47,247,.16)}
.field{margin:0 0 .95rem;border:0;padding:0;min-width:0}
.field>label,.field legend{display:block;font-weight:600;font-size:.88rem;margin-bottom:.3rem;padding:0}
.hint{font-size:.8rem;color:var(--muted);margin-top:.25rem}
.radio{display:flex;gap:.5rem;align-items:center;font-size:.92rem;padding:.15rem 0}
.radio input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 .8rem}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
fieldset.group{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem .2rem;margin:0 0 1rem}
fieldset.group legend{font-family:var(--serif);font-weight:600;font-size:1.02rem;padding:0 .35rem}

/* tags + lists */
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:.1rem .5rem;border-radius:999px;background:var(--violet-soft);color:var(--violet-ink);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.plain{background:#F6F3FC;color:var(--muted)}
.code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;flex-wrap:wrap;gap:.6rem 1rem;justify-content:space-between;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{min-width:0;flex:1 1 220px}
.item .title{font-weight:600;color:var(--ink);text-decoration:none}
.item a.title:hover{text-decoration:underline}
.sub{font-size:.88rem;color:var(--muted);margin-top:.1rem}
.sub a{color:inherit}
.item-actions{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end;flex:none}
@media (max-width:640px){.item{flex-direction:column;align-items:flex-start}.item-actions{justify-content:flex-start}}
.note{padding:.55rem .75rem;border-radius:9px;margin:.4rem 0;font-size:.9rem;background:var(--amber-soft)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--violet-soft);color:var(--violet-ink)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.8rem}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:.22rem .65rem;border-radius:999px;cursor:pointer}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.seg{display:inline-flex;gap:.25rem;flex-wrap:wrap}
.seg button{font:inherit;font-size:.86rem;font-weight:500;background:#fff;border:1px solid var(--line-2);color:var(--ink);padding:.34rem .75rem;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--violet-soft);border-color:var(--violet);color:var(--violet-ink)}
.viewbar{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.viewbar .lbl{font-size:.82rem;color:var(--muted);margin-right:.2rem}

/* dashboard */
.scanbar{margin-top:1.3rem;background:linear-gradient(130deg,#EDE2FF 0%,#F7F2FF 60%,#FFFFFF 100%);border:1px solid var(--line-2);border-radius:16px;padding:1.2rem 1.3rem}
.scanbar label{display:block;font-family:var(--serif);font-size:1.15rem;margin-bottom:.6rem}
.scanbar input{font-size:1.1rem;padding:.72rem .85rem}
.scanbar .btn{padding:.74rem 1rem}
@media (max-width:520px){.scanbar .row{flex-wrap:wrap}.scanbar .row input{flex-basis:100%}.scanbar .row .btn{flex:1}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-top:1.2rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;text-decoration:none;color:var(--ink);display:block}
a.stat:hover{border-color:var(--violet)}
.stat .n{font-family:var(--serif);font-size:1.7rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.84rem;color:var(--muted)}
.stat.alert .n{color:var(--bad)}
.action-card .btn.lg{margin-top:.6rem}

/* books */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:1.5rem 1.1rem;margin-top:1rem}
.tile{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:.12rem;min-width:0}
.tile .cover{margin-bottom:.5rem;transition:transform .15s ease}
a.tile:hover .cover{transform:translateY(-3px)}
.t-title{font-weight:600;line-height:1.3;font-size:.94rem}
.t-author{font-size:.84rem;color:var(--muted)}
.t-avail{font-size:.8rem;font-weight:600;color:var(--ok);margin-top:.15rem}
.t-avail.out{color:var(--amber)}
.t-loc{font-size:.78rem;color:var(--muted)}
.cover{position:relative;aspect-ratio:2/3;background:var(--c,#7B5CD6);color:#fff;border-radius:3px 8px 8px 3px;padding:16px 12px 12px 19px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 1px 2px rgba(60,20,120,.18),0 12px 22px -14px rgba(60,20,120,.55)}
.cover::before{content:"";position:absolute;top:0;bottom:0;left:0;width:9px;background:linear-gradient(90deg,rgba(40,10,90,.28),rgba(255,255,255,.18) 70%,rgba(40,10,90,.1));z-index:1}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%);pointer-events:none}
.cv-title{font-family:var(--serif);font-weight:600;font-size:1rem;line-height:1.18;border-top:1px solid rgba(255,255,255,.55);padding-top:8px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cv-author{font-size:.72rem;opacity:.9;border-top:1px solid rgba(255,255,255,.45);padding-top:6px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.cover.lg{width:180px;flex:none}
.cover.lg .cv-title{font-size:1.3rem}
.cover.sm{width:64px;flex:none;padding:8px 6px 6px 11px;border-radius:2px 5px 5px 2px}
.cover.sm::before{width:6px}
.cover.sm .cv-title{font-size:.62rem;padding-top:4px;-webkit-line-clamp:5}
.cover.sm .cv-author{display:none}
.book-hero{display:flex;gap:2rem;align-items:flex-start}
.book-title{font-size:2.05rem}
.byline{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--muted);margin:.2rem 0 1rem}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:.25rem 1rem;margin:0 0 1rem;font-size:.92rem}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.desc{max-width:62ch;line-height:1.6}
@media (max-width:640px){.book-hero{flex-direction:column}.cover.lg{width:140px}}
.group-h{margin-top:1.6rem;display:flex;gap:.6rem;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.35rem}
.copy-in{margin-bottom:.4rem}
.copy-in .muted{width:4.5rem;flex:none}

/* member home */
.loan-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:.9rem;margin-top:1rem}
.loan-card{display:flex;gap:1rem;background:linear-gradient(140deg,#F3ECFF,#FFFFFF 70%);border:1px solid var(--line-2);border-radius:14px;padding:.9rem}
.loan-card.over{background:linear-gradient(140deg,#FDECEF,#FFFFFF 70%);border-color:#F5C9D0}
.loan-card h3{margin:0 0 .3rem;font-size:1.08rem}
.days{font-family:var(--serif);font-size:1.5rem;line-height:1.1;margin-top:.4rem}
.days small{font-family:var(--sans);font-size:.8rem;color:var(--muted);display:block}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td select{width:auto;padding:.25rem .4rem;font-size:.85rem}
tr.click{cursor:pointer}
tr.click:hover{background:var(--violet-soft)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0 1rem}
.money dt{font-size:.82rem;color:var(--muted)}
.money dd{margin:0;font-family:var(--serif);font-size:1.5rem}
.money dd.bad{color:var(--bad)}
.pf{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.2rem;margin:.4rem 0 0;font-size:.93rem}
.pf dt{color:var(--muted)} .pf dd{margin:0;white-space:pre-line}
.course-row{display:grid;grid-template-columns:2fr 1fr 1.2fr 1.2fr auto;gap:.4rem;margin-bottom:.45rem;align-items:center}
@media (max-width:640px){.course-row{grid-template-columns:1fr 1fr;padding:.6rem;border:1px solid var(--line);border-radius:10px}.course-row .c-name{grid-column:1/-1}}

/* pickers */
.picklist{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.pick{text-align:left;background:var(--violet-soft);border:0;border-radius:7px;padding:.5rem .65rem;font:inherit;font-size:.92rem;color:var(--ink);cursor:pointer}
.pick:hover{outline:1px solid var(--violet)}
.pick.disabled{opacity:.6;cursor:default}
.pad{padding:.4rem 0}
.chosen{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem .8rem;border:1px solid var(--line-2);border-left:3px solid var(--violet);border-radius:9px;margin-top:.4rem;background:#FCFAFF}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:2rem 1rem;padding-top:calc(2rem + env(safe-area-inset-top,0px))}
.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:1.6rem 1.6rem 1.4rem;box-shadow:0 30px 60px -30px rgba(90,40,180,.35)}
.spines{display:flex;align-items:flex-end;gap:4px;height:64px;margin-bottom:1.2rem}
.spines span{width:15px;border-radius:2px 2px 1px 1px;background:var(--c);box-shadow:inset 3px 0 0 rgba(255,255,255,.25)}
.spines span.tilt{transform:rotate(10deg);transform-origin:bottom left;margin-left:3px}
.login-card h1{font-size:1.75rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--wash);border-radius:11px;padding:4px;margin:1.2rem 0 1.1rem}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;border:0;background:transparent;padding:.5rem;border-radius:8px;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--violet-ink);box-shadow:0 1px 3px rgba(90,40,180,.15)}
.pin{letter-spacing:.4em;font-size:1.15rem;font-variant-numeric:tabular-nums}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(600px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(60,20,120,.45);overflow:auto}
dialog.wide{width:min(820px,96vw)}
dialog::backdrop{background:rgba(60,35,110,.28);backdrop-filter:blur(2px)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:3}
.m-head h3{margin:0;font-size:1.2rem}
.m-body{padding:1.05rem 1.25rem 1.25rem}
.m-actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.1rem}
.icon-btn{background:none;border:0;font-size:1.05rem;cursor:pointer;color:var(--muted);padding:.25rem .45rem;border-radius:6px}
.icon-btn:hover{background:var(--violet-soft)}
#scan-region{width:100%;min-height:220px;background:#1d1530;border-radius:10px;overflow:hidden}
#scan-region video{width:100%!important;height:auto!important;display:block}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:11px;font-size:.92rem;z-index:1000;box-shadow:0 12px 30px -10px rgba(40,20,90,.5);max-width:min(560px,92vw);animation:rise .2s ease}
.toast.bad{background:var(--bad)}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.loading,.fatal{max-width:560px;margin:20vh auto;padding:1.5rem;text-align:center;font-family:var(--serif);font-size:1.2rem;color:var(--muted)}
.fatal{font-family:var(--sans);font-size:1rem;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink)}
</style>
</head>
<body>
<div id="app"><div class="loading">Opening the library…</div></div>

<dialog id="modal" aria-labelledby="m-title">
  <div class="m-head"><h3 id="m-title"></h3><button class="icon-btn" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="m-body" id="m-body"></div>
</dialog>

<dialog id="scanner" aria-label="Scan a code">
  <div class="m-head"><h3>Scan a code</h3><button class="icon-btn" onclick="Scan.close()" aria-label="Close scanner">✕</button></div>
  <div class="m-body">
    <div id="scan-region"></div>
    <p id="scan-msg" class="muted small"></p>
    <div class="row"><input id="scan-manual" placeholder="Or type the code" onkeydown="if(event.key==='Enter'){event.preventDefault();Scan.manual()}"><button class="btn" onclick="Scan.manual()">Use code</button></div>
  </div>
</dialog>
<datalist id="course-list"></datalist>
<datalist id="tag-list"></datalist>

<script>
'use strict';
/* =========================================================
   1. CONNECT YOUR DATABASE
   Paste your Supabase Project URL and anon public key below.
   While they are empty, the app runs in DEMO mode with sample
   data saved only in this browser.
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: '',        // e.g. 'https://abcd1234.supabase.co'
  SUPABASE_ANON_KEY: '',   // the long "anon public" key
  // Members sign in with mobile + PIN. Behind the scenes each member gets a
  // private login address on this domain. No emails are ever sent to it.
  MEMBER_LOGIN_DOMAIN: 'members.pranalife.in',
};

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const TABLES = ['books','copies','members','loans','reservations','payments','activity'];
const DEFAULT_COURSES = ['Basic Pranic Healing (Level 1)','Advanced Pranic Healing (Level 2)','Pranic Psychotherapy (Level 3)','Pranic Crystal Healing','Pranic Psychic Self-Defense','Achieving Oneness with the Higher Soul','Arhatic Yoga Preparatory','Kriyashakti','Spiritual Business Management','Om Mani Padme Hum','Higher Clairvoyance','Pranic Feng Shui','Inner Teachings of Hinduism Revealed','Universal and Kabbalistic Mysteries of the Lord\'s Prayer'];
const DEFAULT_SETTINGS = {
  id:1, library_name:'Prana Life Library', currency:'₹', country_code:'91',
  loan_days:14, max_books:3, renewal_days:14, max_renewals:1, hold_days:2, due_soon_days:2,
  fine_per_day:5, fine_grace_days:0, max_fine:0, deposit_amount:500,
  categories:'Pranic Healing,Arhatic Yoga,Spiritual,Esoteric,Meditation,Course books,Other',
  courses:DEFAULT_COURSES.join('\n'),
  tpl_issued:'Namaste {name} 🙏 You have borrowed "{title}" from {library}. Please return it by {due}. Happy reading!',
  tpl_due:'Namaste {name} 🙏 A gentle reminder from {library}: "{title}" is due on {due}. Please return or renew it on time. Thank you!',
  tpl_overdue:'Namaste {name} 🙏 "{title}" from {library} was due on {due}, {days} day(s) ago. The late fee so far is {fine}. Kindly return it at the earliest. Thank you!',
  tpl_ready:'Namaste {name} 🙏 "{title}", which you reserved, is back at {library}. It is kept for you until {until}. If it is not collected by then, it goes to the next reader.',
  tpl_login:'Namaste {name} 🙏 Your {library} account is ready. Open {link}, tap "First time here?", enter your mobile number and this code: {code}. Then choose a 6-digit PIN.',
};

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const uniq = a => [...new Set(a)];
const cmp = (a, b) => String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'});
function ymd(d){ const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); }
const today = () => ymd(new Date());
function addDays(s, n){ const [y,m,d] = s.split('-').map(Number); return ymd(new Date(y, m-1, d + Number(n||0))); }
function daysBetween(a, b){ const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 864e5); }
function fmtDate(s){ if(!s) return '—'; const d = s.length === 10 ? new Date(s + 'T00:00:00') : new Date(s); return d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}); }
function fmtDateTime(s){ if(!s) return '—'; const d = new Date(s); return d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) + ', ' + d.toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'}); }
function fmtMonth(s){ if(!s) return ''; const [y, m] = s.split('-'); return m ? new Date(+y, +m - 1, 1).toLocaleDateString('en-IN', {month:'short', year:'numeric'}) : y; }
function relDue(d){ const n = daysBetween(today(), d); if(n === 0) return 'today'; if(n === 1) return 'tomorrow'; if(n < 0) return `${-n} days ago`; if(n < 7) return `in ${n} days`; return fmtDate(d); }
function relTime(iso){ const n = daysBetween(ymd(iso), today()); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`; }
const money = n => (S.settings.currency || '₹') + Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits:2});
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const fill = (tpl, v) => String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined ? v[k] : m);
const stripNull = o => Object.fromEntries(Object.entries(o || {}).filter(([, v]) => v !== null && v !== undefined));
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function normPhone(p){
  let d = String(p || '').replace(/\D/g, ''); if(d.startsWith('00')) d = d.slice(2);
  const cc = String(S.settings.country_code || '91').replace(/\D/g, '');
  if(d.length === 10) d = cc + d; else if(d.length === 11 && d.startsWith('0')) d = cc + d.slice(1);
  return d;
}
function fmtPhone(p){ const d = String(p || ''); if(!d) return ''; if(d.length === 12 && d.startsWith('91')) return `+91 ${d.slice(2, 7)} ${d.slice(7)}`; return '+' + d; }
function genCode(){ const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; const r = new Uint32Array(6); (window.crypto || {getRandomValues:x => x.map(() => Math.random() * 1e9)}).getRandomValues(r); r.forEach(n => s += a[n % a.length]); return s; }
const tagsOf = b => Array.isArray(b.tags) ? b.tags.filter(Boolean) : String(b.tags || '').split(',').map(s => s.trim()).filter(Boolean);
const locStr = b => [b.room && 'Room ' + b.room, b.rack && 'Rack ' + b.rack, b.row_no && 'Row ' + b.row_no].filter(Boolean).join(', ');
const backText = d => d && d >= today() ? `expected back by <b>${fmtDate(d)}</b>` : 'running late, expected back soon';
const coursesOf = m => Array.isArray(m && m.courses) ? m.courses : [];

/* ---------- state ---------- */
const S = { settings:{...DEFAULT_SETTINGS}, books:[], copies:[], members:[], loans:[], reservations:[], payments:[], activity:[], me:null, session:null, availMap:null, noProfile:false, ui:{loginTab:'member', memberStep:'login'} };

/* ---------- data layer: demo (browser) ---------- */
const Local = {
  key:'pranalife-library-demo-v2', mem:null, sessKey:'pranalife-library-demo-v2-session', sessMem:null,
  load(){ if(this.mem) return this.mem; let d = null; try { d = JSON.parse(localStorage.getItem(this.key)); } catch(e) {} this.mem = d || seedDemo(); this.save(); return this.mem; },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.mem)); } catch(e) {} },
  getSession(){ if(this.sessMem !== null) return this.sessMem; try { this.sessMem = localStorage.getItem(this.sessKey) || ''; } catch(e) { this.sessMem = ''; } return this.sessMem; },
  setSession(id){ this.sessMem = id || ''; try { localStorage.setItem(this.sessKey, this.sessMem); } catch(e) {} },
  async list(t){ return clone(this.load()[t] || []); },
  async getSettings(){ return clone(this.load().settings); },
  async insert(t, row){ const d = this.load(); const rows = (Array.isArray(row) ? row : [row]).map(r => ({id:uid(), created_at:nowIso(), ...r})); d[t].push(...rows); this.save(); return clone(rows); },
  async update(t, id, p){ const d = this.load(); const r = d[t].find(x => x.id === id); if(!r) throw new Error('That record no longer exists.'); Object.assign(r, p); this.save(); return clone(r); },
  async remove(t, id){ const d = this.load(); d[t] = d[t].filter(x => x.id !== id); this.save(); },
  async saveSettings(p){ const d = this.load(); Object.assign(d.settings, p); this.save(); return clone(d.settings); },
  reset(){ try { localStorage.removeItem(this.key); localStorage.removeItem(this.sessKey); } catch(e) {} this.mem = null; this.sessMem = null; },
};

/* ---------- data layer: Supabase ---------- */
const Remote = {
  sb:null,
  init(){ if(!window.supabase) throw new Error('The Supabase script did not load. Check your internet connection.'); this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); },
  async list(t){ let all = [], from = 0; for(;;){ const {data, error} = await this.sb.from(t).select('*').range(from, from + 999); if(error) throw error; all = all.concat(data); if(data.length < 1000) break; from += 1000; } return all; },
  async getSettings(){ const {data, error} = await this.sb.from('settings').select('*').eq('id', 1).maybeSingle(); if(error) throw error; return data || {}; },
  async insert(t, row){ const {data, error} = await this.sb.from(t).insert(row).select(); if(error) throw error; return data; },
  async update(t, id, p){ const {data, error} = await this.sb.from(t).update(p).eq('id', id).select(); if(error) throw error; if(!data.length) throw new Error('You do not have permission to change this.'); return data[0]; },
  async remove(t, id){ const {error} = await this.sb.from(t).delete().eq('id', id); if(error) throw error; },
  async saveSettings(p){ const {data, error} = await this.sb.from('settings').update(p).eq('id', 1).select(); if(error) throw error; return data[0]; },
  async rpc(fn, args){ const {data, error} = await this.sb.rpc(fn, args || {}); if(error) throw error; return data; },
};
const DB = DEMO ? Local : Remote;

async function addRow(t, row){ const r = await DB.insert(t, row); S[t].push(...r); return r[0]; }
async function addRows(t, rows){ if(!rows.length) return []; const r = await DB.insert(t, rows); S[t].push(...r); return r; }
async function patch(t, id, p){ const r = await DB.update(t, id, p); const i = S[t].findIndex(x => x.id === id); if(i >= 0) S[t][i] = r; else S[t].push(r); return r; }
async function delRow(t, id){ await DB.remove(t, id); S[t] = S[t].filter(x => x.id !== id); }
async function logAct(kind, o = {}){
  try { await addRow('activity', {kind, member_id:o.m || null, book_id:o.b || null, copy_id:o.c || null, loan_id:o.l || null, amount:o.amt ?? null, detail:o.d || null, by_name:S.me ? S.me.name : '', created_at:nowIso()}); }
  catch(e){ console.warn('Could not log activity', e); }
}

/* ---------- lookups + rules ---------- */
const byId = (t, id) => S[t].find(x => x.id === id);
const book = id => byId('books', id), copy = id => byId('copies', id), member = id => byId('members', id), loan = id => byId('loans', id), resv = id => byId('reservations', id);
const isStaff = () => !!S.me && ['librarian','admin'].includes(S.me.role) && S.me.status !== 'suspended';
const isAdmin = () => isStaff() && S.me.role === 'admin';
const activeLoans = () => S.loans.filter(l => !l.returned_at);
const loanOfCopy = cid => S.loans.find(l => l.copy_id === cid && !l.returned_at);
const copiesOf = bid => S.copies.filter(c => c.book_id === bid).sort((a, b) => cmp(a.code, b.code));
const copyByCode = code => { const k = String(code || '').trim().toLowerCase(); return k ? S.copies.find(c => c.code.toLowerCase() === k) : null; };
const memberActive = mid => activeLoans().filter(l => l.member_id === mid);
const isOverdue = l => !l.returned_at && daysBetween(l.due_at, today()) > 0;
const overdueDays = l => l.returned_at ? 0 : Math.max(0, daysBetween(l.due_at, today()));
const isDueSoon = l => { if(l.returned_at) return false; const d = daysBetween(today(), l.due_at); return d >= 0 && d <= Number(S.settings.due_soon_days); };
function accruedFine(l){
  const end = l.returned_at ? ymd(l.returned_at) : today();
  const late = daysBetween(l.due_at, end) - Number(S.settings.fine_grace_days || 0);
  let f = Math.max(0, late) * Number(S.settings.fine_per_day || 0);
  const cap = Number(S.settings.max_fine || 0); if(cap > 0) f = Math.min(f, cap);
  return f;
}
const finesDue = mid => S.loans.filter(l => l.member_id === mid && l.fine_status === 'due').reduce((s, l) => s + Number(l.fine_amount || 0), 0);
const nextDue = bid => activeLoans().filter(l => l.book_id === bid).map(l => l.due_at).sort()[0];
function availInfo(bid){
  if(S.availMap){ const a = S.availMap[bid]; return a ? {total:a.total, avail:a.available, nextBack:a.next_back} : {total:0, avail:0, nextBack:null}; }
  const cs = copiesOf(bid).filter(c => !['lost','retired'].includes(c.status));
  return {total:cs.length, avail:cs.filter(c => c.status === 'available').length, nextBack:nextDue(bid)};
}
const pendingFor = bid => S.reservations.filter(r => r.book_id === bid && r.status === 'pending').sort((a, b) => cmp(a.created_at, b.created_at));
const holdFor = cid => S.reservations.find(r => r.copy_id === cid && r.status === 'ready');
const holdUntil = r => addDays(ymd(r.ready_at), S.settings.hold_days);
const lastReminder = lid => S.activity.filter(a => a.kind === 'reminder' && a.loan_id === lid).sort((a, b) => cmp(b.created_at, a.created_at))[0];
function categories(){ const base = String(S.settings.categories || '').split(',').map(s => s.trim()).filter(Boolean); S.books.forEach(b => { if(b.category && !base.includes(b.category)) base.push(b.category); }); return base; }
const allTags = () => uniq(S.books.flatMap(tagsOf)).sort(cmp);
const courseOptions = () => String(S.settings.courses || '').split('\n').map(s => s.trim()).filter(Boolean);
function nextNum(list, re){ let max = 0; list.forEach(v => { const m = re.exec(v || ''); if(m) max = Math.max(max, Number(m[1])); }); return max + 1; }
const codeFmt = n => 'PL-' + String(n).padStart(4, '0');
const nextCopyNum = () => nextNum(S.copies.map(c => c.code), /^PL-(\d+)$/i);
const nextMemberCode = () => 'PLM-' + String(nextNum(S.members.map(m => m.member_code), /^PLM-(\d+)$/i)).padStart(3, '0');
const FINE_LABEL = {due:'due', paid:'paid', waived:'waived'};
const KIND_LABEL = {fine:'Late fee', deposit:'Deposit received', deposit_refund:'Deposit refunded', lost_book:'Lost book', other:'Other'};
const METHOD_LABEL = {cash:'Cash', upi:'UPI', deposit:'From deposit'};
const ACT = {
  issued:['Issued','borrow'], returned:['Returned','borrow'], renewed:['Renewed','borrow'], lost:['Marked lost','borrow'],
  reserved:['Reserved','reserve'], res_cancelled:['Reservation cancelled','reserve'], hold:['Kept aside for pickup','reserve'], hold_released:['Hold released','reserve'], hold_expired:['Hold expired, not collected','reserve'],
  fee_paid:['Late fee paid','money'], fee_due:['Late fee added to dues','money'], fee_waived:['Late fee waived','money'], deposit:['Deposit received','money'], refund:['Deposit refunded','money'],
  reminder:['WhatsApp message','remind'],
  member_added:['Member added','people'], member_edited:['Member details updated','people'], profile_edited:['Profile updated by member','people'], login_reset:['Login reset','people'], login_code:['Login code sent','people'],
  book_added:['Book added','catalog'], book_edited:['Book details updated','catalog'], copies_added:['Copies added','catalog'], copy_status:['Copy status changed','catalog'], barcode:['Barcode changed','catalog'], book_deleted:['Book deleted','catalog'], import:['Books imported','catalog'],
};
const ACT_GROUPS = [['', 'All activity'], ['borrow', 'Borrowing'], ['reserve', 'Reservations'], ['money', 'Money'], ['remind', 'WhatsApp messages'], ['people', 'Members'], ['catalog', 'Catalog']];

/* ---------- WhatsApp ---------- */
const waUrl = (p, msg) => `https://wa.me/${normPhone(p)}?text=${encodeURIComponent(msg)}`;
function openWA(p, msg){ if(!p){ toast('Add a mobile number for this member first.', 'bad'); return false; } window.open(waUrl(p, msg), '_blank', 'noopener'); return true; }
function msgVars(m, b, extra = {}){ return {name:firstName(m && m.name), title:(b && b.title) || '', library:S.settings.library_name, ...extra}; }
const appLink = () => location.origin + location.pathname;

/* ---------- UI primitives ---------- */
function openModal(title, html, wide){
  $('#m-title').textContent = title; $('#m-body').innerHTML = html; const d = $('#modal'); d.classList.toggle('wide', !!wide); if(!d.open) d.showModal();
  const f = d.querySelector('#m-body input:not([readonly]):not([type=radio]), #m-body select, #m-body textarea');
  if(f && !f.closest('[hidden]')) f.focus(); else { const b = d.querySelector('#m-body .m-actions .btn:last-child'); if(b) b.focus(); }
}
function closeModal(){ const d = $('#modal'); if(d.open) d.close(); }
function toast(msg, kind = 'ok'){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.textContent = msg;
  const host = $('#scanner').open ? $('#scanner') : $('#modal').open ? $('#modal') : document.body;
  host.appendChild(t); setTimeout(() => t.remove(), 4500);
}
const go = h => { if(location.hash === '#' + h) render(); else location.hash = h; };
const PALETTE = ['#7B5CD6','#9468D9','#6B5BC9','#8A5FC2','#5F6BD3','#A06BCB','#7868BA','#6D4FC6'];
function shade(s){ let h = 0; for(const ch of String(s || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function cover(b, size = ''){
  return `<div class="cover ${size}" style="--c:${shade(b.category || b.title)}"><span class="cv-title">${esc(b.title)}</span><span class="cv-author">${esc(b.author || '')}</span>${b.cover_url ? `<img src="${esc(b.cover_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>`;
}
function statusTag(s){ const m = {available:['ok','On the shelf'], issued:['','Issued'], on_hold:['warn','Kept aside'], damaged:['bad','Damaged'], lost:['bad','Lost'], retired:['plain','Retired']}[s] || ['', s]; return `<span class="tag ${m[0]}">${m[1]}</span>`; }
const statBox = (n, l, href, alert) => href ? `<a class="stat ${alert ? 'alert' : ''}" href="${href}"><span class="n">${n}</span><span class="l">${l}</span></a>` : `<div class="stat ${alert ? 'alert' : ''}"><span class="n">${n}</span><span class="l">${l}</span></div>`;
const notFound = (msg, back) => `<a class="back" href="${back}">Go back</a><p class="empty">${msg}</p>`;
const roleTag = m => m.role === 'admin' ? '<span class="tag">Admin</span>' : m.role === 'librarian' ? '<span class="tag">Librarian</span>' : '';
const tagChips = b => tagsOf(b).map(t => `<span class="tag plain">${esc(t)}</span>`).join(' ');
function fillDatalists(){
  const c = $('#course-list'); if(c) c.innerHTML = courseOptions().map(o => `<option value="${esc(o)}">`).join('');
  const t = $('#tag-list'); if(t) t.innerHTML = allTags().map(o => `<option value="${esc(o)}">`).join('');
}

/* =========================================================
   LOGIN
   ========================================================= */
function vLogin(){
  const tab = S.ui.loginTab, step = S.ui.memberStep;
  const spines = ['#B9A4F5:52','#8E6BE6:62','#CDBDF8:44','#7B2FF7:58','#A98BEF:48','#DCCFFB:40','#9A7CEA:56'].map((s, i) => { const [c, h] = s.split(':'); return `<span style="--c:${c};height:${h}px" class="${i === 6 ? 'tilt' : ''}"></span>`; }).join('');
  let form;
  if(tab === 'staff'){
    form = `<div class="field"><label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username" onkeydown="if(event.key==='Enter'){event.preventDefault();A.staffLogin()}"></div>
      <div class="field"><label for="lg-pw">Password</label><input id="lg-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();A.staffLogin()}"></div>
      <button class="btn block lg" onclick="A.staffLogin()">Sign in to the library desk</button>`;
  } else if(step === 'setup'){
    form = `<p class="muted small">The library gives you a 6-letter code when you join. Use it once to choose your PIN.</p>
      <div class="field"><label for="lg-phone">Mobile number</label><input id="lg-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98xxxxxxxx"></div>
      <div class="field"><label for="lg-code">Code from the library</label><input id="lg-code" autocomplete="one-time-code" style="text-transform:uppercase;letter-spacing:.2em" maxlength="6"></div>
      <div class="grid2"><div class="field"><label for="lg-pin">Choose a 6-digit PIN</label><input id="lg-pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
      <div class="field"><label for="lg-pin2">Type it again</label><input id="lg-pin2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" onkeydown="if(event.key==='Enter'){event.preventDefault();A.memberSetup()}"></div></div>
      <button class="btn block lg" onclick="A.memberSetup()">Set my PIN</button>
      <p class="small" style="margin-top:.8rem"><button class="link" onclick="A.memberStep('login')">I already have a PIN</button></p>`;
  } else {
    form = `<div class="field"><label for="lg-phone">Mobile number</label><input id="lg-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98xxxxxxxx"></div>
      <div class="field"><label for="lg-pin">PIN</label><input id="lg-pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();A.memberLogin()}"></div>
      <button class="btn block lg" onclick="A.memberLogin()">Sign in</button>
      <p class="small" style="margin-top:.8rem"><button class="link" onclick="A.memberStep('setup')">First time here? Set up your PIN</button></p>
      <p class="small muted">Forgot your PIN? Ask the librarian to reset your login.</p>`;
  }
  const demo = DEMO ? `<div class="demo" style="margin:1.2rem 0 0">
      <b>Demo logins.</b> Member: mobile 98000 00002, PIN 123456.
      First-time setup: mobile 98000 00006, code PRANA6.
      Library desk: admin@pranalife.in, password admin123.</div>` : '';
  return `<div class="login-wrap"><div class="login-card">
    <div class="spines" aria-hidden="true">${spines}</div>
    <h1>${esc(S.settings.library_name)}</h1>
    <p class="muted">Borrow spiritual, esoteric and course books, and keep track of your reading.</p>
    <div class="tabs" role="tablist"><button role="tab" class="${tab === 'member' ? 'on' : ''}" aria-selected="${tab === 'member'}" onclick="A.loginTab('member')">Member</button><button role="tab" class="${tab === 'staff' ? 'on' : ''}" aria-selected="${tab === 'staff'}" onclick="A.loginTab('staff')">Library desk</button></div>
    ${form}<div id="lg-msg" aria-live="polite"></div>${demo}
  </div></div>`;

function vNoProfile(){

      ${pays.length ? `<h3>Payments</h3><div class="tbl-wrap"><table class="tbl"><tbody>${pays.map(p => `<tr><td>${fmtDate(p.created_at)}</td><td>${KIND_LABEL[p.kind] || esc(p.kind)}</td><td>${money(p.amount)}</td><td class="muted">${METHOD_LABEL[p.method] || esc(p.method || '')}</td></tr>`).join('')}</tbody></table></div>` : ''}

/* ---------- reservations ---------- */
function resRow(r){
  const b = book(r.book_id), m = member(r.member_id), a = availInfo(r.book_id);
  let sub, acts;
  if(r.status === 'ready'){
    const until = holdUntil(r), last = until === today();
    sub = `<span class="code">${esc(copy(r.copy_id)?.code || '')}</span> kept aside until <b>${fmtDate(until)}</b> ${last ? '<span class="tag warn">Last day</span>' : ''}`;
    acts = `<button class="btn sm" onclick="A.issueModal({memberId:'${r.member_id}',copyId:'${r.copy_id}'})">Issue</button><button class="btn sm wa" onclick="A.remindRes('${r.id}')">WhatsApp</button><button class="btn sm ghost" onclick="A.release('${r.id}')">Release</button>`;
  } else {
    const pos = pendingFor(r.book_id).findIndex(x => x.id === r.id) + 1;
    sub = `Reserved ${fmtDate(r.created_at)}, ${pos === 1 ? 'first' : 'number ' + pos} in line. ${a.avail ? '<span class="tag ok">A copy is on the shelf</span>' : a.nextBack ? 'Expected back ' + fmtDate(a.nextBack) : ''}`;
    acts = `${a.avail ? `<button class="btn sm" onclick="A.holdPick('${r.id}')">Keep a copy aside</button>` : ''}<button class="btn sm ghost" onclick="A.cancelRes('${r.id}')">Cancel</button>`;
  }
  return `<li class="item"><div class="item-main"><a class="title" href="#book/${r.book_id}">${esc(b ? b.title : 'Removed book')}</a><div class="sub"><a href="#member/${r.member_id}">${esc(m ? m.name : 'Unknown member')}</a>${m && m.phone ? ', ' + esc(fmtPhone(m.phone)) : ''}</div><div class="sub">${sub}</div></div><div class="item-actions">${acts}</div></li>`;
}
function vRes(){
  const ready = S.reservations.filter(r => r.status === 'ready').sort((a, b) => cmp(a.ready_at, b.ready_at));
  const pend = S.reservations.filter(r => r.status === 'pending').sort((a, b) => cmp(a.created_at, b.created_at));
  return `<header class="page-head"><div><h1>Reservations</h1><p class="muted">When a reserved book comes back, it is kept aside for ${plural(Number(S.settings.hold_days), 'day')}. If the member doesn't come in by then, the hold ends on its own and the book goes to whoever comes in.</p></div><button class="btn" onclick="A.resForm()">Add a reservation</button></header>
  <section class="panel"><h2>Kept aside for pickup (${ready.length})</h2><ul class="list">${ready.map(resRow).join('') || '<li class="empty">No books are kept aside.</li>'}</ul></section>
  <section class="panel"><h2>Waiting for a copy (${pend.length})</h2><ul class="list">${pend.map(resRow).join('') || '<li class="empty">Nobody is waiting for a book.</li>'}</ul></section>`;
}

function vReminders(){
  const act = activeLoans(), over = act.filter(isOverdue).sort((a, b) => cmp(a.due_at, b.due_at)), soon = act.filter(isDueSoon).sort((a, b) => cmp(a.due_at, b.due_at));
  const ready = S.reservations.filter(r => r.status === 'ready');
  const sentToday = S.activity.filter(r => r.kind === 'reminder' && ymd(r.created_at) === today()).length;
  return `<header class="page-head"><div><h1>Reminders</h1><p class="muted">“WhatsApp” opens a ready-written message to the member. Press send in WhatsApp and it's logged in the records. ${sentToday ? plural(sentToday, 'message') + ' sent today.' : ''}</p></div></header>
  <section class="panel"><h2>Overdue (${over.length})</h2><ul class="list">${over.map(l => loanRow(l, {full:true})).join('') || '<li class="empty">Nothing overdue.</li>'}</ul></section>
  <section class="panel"><h2>Due in the next ${plural(Number(S.settings.due_soon_days), 'day')} (${soon.length})</h2><ul class="list">${soon.map(l => loanRow(l, {full:true})).join('') || '<li class="empty">Nothing due soon.</li>'}</ul></section>
  <section class="panel"><h2>Kept aside for pickup (${ready.length})</h2><ul class="list">${ready.map(resRow).join('') || '<li class="empty">No books are kept aside.</li>'}</ul></section>`;
}

/* ---------- records ---------- */
function actTable(rows, compact){
  if(!rows.length) return '<p class="empty">No records yet.</p>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>What</th>${compact ? '' : '<th>Member</th>'}<th>Book</th><th>Amount</th><th>Details</th>${compact ? '' : '<th>By</th>'}</tr></thead><tbody>${rows.map(a => {
    const m = member(a.member_id), b = book(a.book_id), c = copy(a.copy_id);
    const memberCell = m ? `<a href="#member/${m.id}">${esc(m.name)}</a>` : '';
    return `<tr><td style="white-space:nowrap">${fmtDateTime(a.created_at)}</td><td><b>${esc((ACT[a.kind] || [a.kind])[0])}</b>${compact && m ? `<div class="small">${memberCell}</div>` : ''}</td>${compact ? '' : `<td>${memberCell}</td>`}<td>${b ? `<a href="#book/${b.id}">${esc(b.title)}</a>` : ''}${c ? ` <span class="code small">${esc(c.code)}</span>` : ''}</td><td>${a.amount != null ? money(a.amount) : ''}</td><td class="small">${esc(a.detail || '')}</td>${compact ? '' : `<td class="small muted">${esc(a.by_name || '')}</td>`}</tr>`;
  }).join('')}</tbody></table></div>`;
}
function recordRows(){
  const u = S.ui, q = (u.rq || '').toLowerCase().trim();
  return S.activity.filter(a => {
    if(u.rgroup && (ACT[a.kind] || [])[1] !== u.rgroup) return false;
    const d = ymd(a.created_at); if(u.rfrom && d < u.rfrom) return false; if(u.rto && d > u.rto) return false;
    if(q){ const m = member(a.member_id), b = book(a.book_id), c = copy(a.copy_id); if(![m && m.name, m && m.phone, m && m.member_code, b && b.title, c && c.code, a.detail, a.by_name].some(v => (v || '').toLowerCase().includes(q))) return false; }
    return true;
  }).sort((a, b) => cmp(b.created_at, a.created_at));
}
function vRecords(){
  const u = S.ui, rows = recordRows(), lim = u.rlimit || 200;
  return `<header class="page-head"><div><h1>Records</h1><p class="muted">Every issue, return, renewal, reservation, payment, message and change, with who did it and when.</p></div><button class="btn ghost" onclick="A.recordsCsv()">Download CSV</button></header>
  <div class="toolbar"><input class="search" type="search" placeholder="Search member, mobile, book or barcode" value="${esc(u.rq || '')}" onchange="S.ui.rq=this.value;S.ui.rlimit=200;render()" onkeydown="if(event.key==='Enter'){event.preventDefault();S.ui.rq=this.value;render()}">
    <select aria-label="Type" onchange="S.ui.rgroup=this.value;render()">${ACT_GROUPS.map(([v, t]) => `<option value="${v}" ${(u.rgroup || '') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label class="row small">From <input type="date" value="${esc(u.rfrom || '')}" onchange="S.ui.rfrom=this.value;render()"></label>
    <label class="row small">To <input type="date" value="${esc(u.rto || '')}" onchange="S.ui.rto=this.value;render()"></label></div>
  <section class="panel"><p class="muted small" style="margin-top:0">${plural(rows.length, 'record')}</p>${actTable(rows.slice(0, lim), false)}
  ${rows.length > lim ? `<div class="m-actions" style="justify-content:center"><button class="btn ghost" onclick="S.ui.rlimit=${lim + 300};render()">Show more</button></div>` : ''}</section>`;
}

/* ---------- reports ---------- */
function periodStart(){ const p = S.ui.period || '90'; return p === 'all' ? '0000-00-00' : addDays(today(), -Number(p)); }
const inPeriod = iso => !!iso && ymd(iso) >= periodStart();
const bt = l => book(l.book_id)?.title || '', mn = l => member(l.member_id)?.name || '';
const REPORTS = {
  overdue:{label:'Overdue', build:() => ({rows:activeLoans().filter(isOverdue).sort((a, b) => cmp(a.due_at, b.due_at)),
    cols:[['Book', bt], ['Barcode', l => copy(l.copy_id)?.code || ''], ['Member', mn], ['Mobile', l => fmtPhone(member(l.member_id)?.phone)], ['Due', l => fmtDate(l.due_at)], ['Days late', overdueDays], ['Late fee so far', l => money(accruedFine(l))]]})},
  out:{label:'Books out', build:() => ({rows:activeLoans().sort((a, b) => cmp(a.due_at, b.due_at)),
    cols:[['Book', bt], ['Barcode', l => copy(l.copy_id)?.code || ''], ['Member', mn], ['Mobile', l => fmtPhone(member(l.member_id)?.phone)], ['Borrowed', l => fmtDate(l.issued_at)], ['Due', l => fmtDate(l.due_at)], ['Renewals', l => l.renewals || 0]]})},
  popular:{label:'Most borrowed', period:true, build:() => {
    const cnt = {}; S.loans.filter(l => inPeriod(l.issued_at)).forEach(l => { cnt[l.book_id] = (cnt[l.book_id] || 0) + 1; });
    const rows = Object.entries(cnt).map(([id, n]) => ({id, n, b:book(id)})).filter(r => r.b).sort((a, b) => b.n - a.n).map((r, i) => ({...r, rank:i + 1}));
    return {rows, cols:[['Rank', r => r.rank], ['Book', r => r.b.title], ['Author', r => r.b.author || ''], ['Category', r => r.b.category || ''], ['Times borrowed', r => r.n], ['Waiting now', r => pendingFor(r.id).length]]};
  }},
  readers:{label:'Most active members', period:true, build:() => {
    const cnt = {}; S.loans.filter(l => inPeriod(l.issued_at)).forEach(l => { cnt[l.member_id] = (cnt[l.member_id] || 0) + 1; });
    const rows = Object.entries(cnt).map(([id, n]) => ({id, n, m:member(id)})).filter(r => r.m).sort((a, b) => b.n - a.n);
    return {rows, cols:[['Member', r => r.m.name], ['Member ID', r => r.m.member_code || ''], ['Mobile', r => fmtPhone(r.m.phone)], ['Books borrowed', r => r.n], ['With them now', r => memberActive(r.id).length], ['Late fees due', r => money(finesDue(r.id))]]};
  }},
  money:{label:'Fees and deposits', period:true, build:() => {
    const pays = S.payments.filter(p => inPeriod(p.created_at)).sort((a, b) => cmp(b.created_at, a.created_at));
    const sum = k => pays.filter(p => p.kind === k).reduce((s, p) => s + Number(p.amount || 0), 0);
    const held = S.members.reduce((s, m) => s + Number(m.deposit_held || 0), 0), owed = S.loans.filter(l => l.fine_status === 'due').reduce((s, l) => s + Number(l.fine_amount || 0), 0);
    return {rows:pays, summary:`<div class="stats">${statBox(money(sum('fine')), 'Late fees collected')}${statBox(money(sum('deposit')), 'Deposits received')}${statBox(money(sum('deposit_refund')), 'Deposits refunded')}${statBox(money(held), 'Deposits held now')}${statBox(money(owed), 'Late fees still owed')}</div>`,
      cols:[['Date', p => fmtDate(p.created_at)], ['Member', mn], ['Type', p => KIND_LABEL[p.kind] || p.kind], ['Amount', p => money(p.amount)], ['Method', p => METHOD_LABEL[p.method] || p.method || ''], ['Note', p => p.note || '']]};
  }},
  inventory:{label:'Inventory', build:() => {
    const times = {}; S.loans.forEach(l => { times[l.book_id] = (times[l.book_id] || 0) + 1; });
    const cnt = (b, st) => copiesOf(b.id).filter(c => st.includes(c.status)).length;
    const rows = [...S.books].sort((a, b) => cmp(a.room || '~', b.room || '~') || cmp(a.rack || '~', b.rack || '~') || cmp(a.row_no || '~', b.row_no || '~') || cmp(a.title, b.title));
    const never = rows.filter(b => !times[b.id]).length;
    return {rows, summary:`<div class="stats">${statBox(S.books.length, 'Titles')}${statBox(S.copies.filter(c => !['lost','retired'].includes(c.status)).length, 'Copies in use')}${statBox(S.copies.filter(c => ['damaged','lost'].includes(c.status)).length, 'Damaged or lost')}${statBox(never, 'Never borrowed')}</div>`,
      cols:[['Room', b => b.room || ''], ['Rack', b => b.rack || ''], ['Row', b => b.row_no || ''], ['Book', b => b.title], ['Author', b => b.author || ''], ['Category', b => b.category || ''], ['Tags', b => tagsOf(b).join(', ')], ['Barcodes', b => copiesOf(b.id).map(c => c.code).join(' ')], ['Copies', b => copiesOf(b.id).length], ['On the shelf', b => cnt(b, ['available'])], ['Out', b => cnt(b, ['issued'])], ['Damaged or lost', b => cnt(b, ['damaged','lost'])], ['Times borrowed', b => times[b.id] || 0]]};
  }},
};
function vReports(){
  const k = REPORTS[S.ui.report] ? S.ui.report : 'overdue', R = REPORTS[k], {rows, cols, summary} = R.build();
  const period = R.period ? `<select aria-label="Period" onchange="S.ui.period=this.value;render()">${[['30', 'Last 30 days'], ['90', 'Last 90 days'], ['365', 'Last 12 months'], ['all', 'All time']].map(([v, t]) => `<option value="${v}" ${(S.ui.period || '90') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>` : '';
  return `<header class="page-head"><h1>Reports</h1></header>
  <div class="toolbar"><div class="seg">${Object.entries(REPORTS).map(([kk, r]) => `<button class="${kk === k ? 'on' : ''}" onclick="S.ui.report='${kk}';render()">${r.label}</button>`).join('')}</div></div>
  <div class="toolbar">${period}<button class="btn ghost" onclick="A.csv()">Download CSV</button></div>
  ${summary || ''}
  <section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${cols.map(c => `<td>${esc(c[1](r))}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">Nothing to show for this report.</td></tr>`}</tbody></table></div></section>`;
}

   ========================================================= */

  const rs = S.reservations.filter(r => r.member_id === me.id && ['pending','ready'].includes(r.status));
  const fd = finesDue(me.id);
  const cards = out.map(l => {
    const b = book(l.book_id) || {title:'Book'}, od = overdueDays(l), left = daysBetween(today(), l.due_at);
    return `<div class="loan-card ${od ? 'over' : ''}">${cover(b, 'sm')}<div><h3>${esc(b.title)}</h3><div class="small muted">${esc(b.author || '')}</div><div class="small muted">Borrowed ${fmtDate(l.issued_at)}</div>
      <div class="days">${od ? `${plural(od, 'day')} late<small>Please return it soon. Late fee so far ${money(accruedFine(l))}.</small>` : left === 0 ? 'Due today<small>Return or renew it at the library today.</small>' : `${plural(left, 'day')} left<small>Return by ${fmtDate(l.due_at)}</small>`}</div></div></div>`;
  }).join('');
  return `<header class="page-head"><div><h1>Namaste, ${esc(firstName(me.name))}</h1><p class="muted">${all.length ? `You've borrowed ${plural(all.length, 'book')} from the library${me.joined_on ? ' since ' + fmtDate(me.joined_on) : ''}.` : 'Welcome to the library.'}</p></div></header>

function vShelf(){
  const u = S.ui, cats = categories();
  return `<header class="page-head"><div><h1>Library shelf</h1><p class="muted">See which books are in the library right now. If a book is out, you can reserve it for when it comes back.</p></div></header>

    <select aria-label="Category" onchange="S.ui.shCat=this.value;$('#shelf-list').innerHTML=shelfRows()"><option value="">All categories</option>${cats.map(c => `<option ${u.shCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <select aria-label="Show" onchange="S.ui.shF=this.value;$('#shelf-list').innerHTML=shelfRows()"><option value="">All books</option><option value="in" ${u.shF === 'in' ? 'selected' : ''}>In the library</option><option value="out" ${u.shF === 'out' ? 'selected' : ''}>Borrowed by someone</option></select></div>
  <section class="panel"><ul class="list" id="shelf-list">${shelfRows()}</ul></section>`;
}
function shelfRows(){
  const u = S.ui, q = (u.shQ || '').toLowerCase().trim(), me = S.me;
  const rows = S.books.filter(b => { const a = availInfo(b.id); if(!a.total) return false; if(u.shCat && b.category !== u.shCat) return false; if(u.shF === 'in' && !a.avail) return false; if(u.shF === 'out' && a.avail) return false; return !q || [b.title, b.author].some(v => (v || '').toLowerCase().includes(q)); }).sort((a, b) => cmp(a.title, b.title));
  return rows.map(b => {
    const a = availInfo(b.id);
    const mine = S.reservations.find(r => r.book_id === b.id && r.member_id === me.id && ['pending','ready'].includes(r.status));
    const have = S.loans.find(l => l.book_id === b.id && l.member_id === me.id && !l.returned_at);
    let status, action = '';
    if(a.avail) status = `<span class="tag ok">In the library</span> ${plural(a.avail, 'copy', 'copies')} on the shelf`;
    else status = `<span class="tag warn">Borrowed</span> ${backText(a.nextBack)}`;
    if(have) action = '<span class="tag">With you</span>';
    else if(mine) action = `<span class="tag ${mine.status === 'ready' ? 'ok' : ''}">${mine.status === 'ready' ? 'Kept aside for you' : 'You reserved this'}</span>`;
    else if(!a.avail) action = `<button class="btn sm" onclick="A.reserve('${b.id}')">Reserve</button>`;
    return `<li class="item"><div class="item-main" style="display:flex;gap:.8rem;align-items:center">${cover(b, 'sm')}<div><span class="title">${esc(b.title)}</span><div class="sub">${esc([b.author, b.category].filter(Boolean).join(', '))}</div><div class="sub">${status}</div></div></div><div class="item-actions">${action}</div></li>`;
  }).join('') || '<li class="empty">No books match.</li>';
}

A.memberLogin = async () => {
  const phone = normPhone($('#lg-phone').value), pin = $('#lg-pin').value.trim();
  if(phone.length < 11) return loginMsg('Enter your 10-digit mobile number.');
  if(!/^\d{6}$/.test(pin)) return loginMsg('Your PIN is 6 digits.');
  if(DEMO){
    const m = Local.load().members.find(x => x.phone === phone);
    if(!m || !m.demo_pin) return loginMsg('This number isn\'t set up yet. Tap “First time here?” and use the code from the library.');
    if(m.demo_pin !== pin) return loginMsg('That PIN isn\'t right. If you forgot it, ask the librarian to reset your login.');
    Local.setSession(m.id); return reload();
  }
  const email = await Remote.rpc('member_login_email', {p_phone:phone});
  if(!email) return loginMsg('This number isn\'t set up yet. Tap “First time here?” and use the code from the library.');
  const {error} = await Remote.sb.auth.signInWithPassword({email, password:pin});
  if(error) return loginMsg('That PIN isn\'t right. If you forgot it, ask the librarian to reset your login.');
  await reload();
};
A.memberSetup = async () => {
  const phone = normPhone($('#lg-phone').value), code = $('#lg-code').value.trim().toUpperCase(), pin = $('#lg-pin').value.trim(), pin2 = $('#lg-pin2').value.trim();
  if(phone.length < 11) return loginMsg('Enter your 10-digit mobile number.');
  if(code.length !== 6) return loginMsg('The code from the library has 6 letters and numbers.');
  if(!/^\d{6}$/.test(pin)) return loginMsg('Choose a PIN of exactly 6 digits.');
  if(pin !== pin2) return loginMsg('The two PINs don\'t match.');
  const mismatch = 'The mobile number and code don\'t match, or this account is already set up. Check the code the library sent you.';
  if(DEMO){
    const d = Local.load(), m = d.members.find(x => x.phone === phone && x.activation_code && x.activation_code === code && !x.demo_pin);
    if(!m) return loginMsg(mismatch);
    m.demo_pin = pin; m.activation_code = null; Local.save(); Local.setSession(m.id); await reload(); return toast('Your PIN is set. Welcome!');
  }
  const email = await Remote.rpc('start_member_login', {p_phone:phone, p_code:code, p_domain:CONFIG.MEMBER_LOGIN_DOMAIN});
  if(!email) return loginMsg(mismatch);
  const {data:su, error} = await Remote.sb.auth.signUp({email, password:pin});
  if(error) throw error;
  if(!su.session) return loginMsg('Almost done, but the library\'s Supabase project still asks for email confirmation. The admin needs to switch off “Confirm email” (see the setup guide).');
  const ok = await Remote.rpc('finish_member_login', {p_phone:phone, p_code:code});
  if(!ok) return loginMsg('Your account could not be linked. Please ask the librarian for a new code.');
  await reload(); toast('Your PIN is set. Welcome!');
};
A.staffLogin = async () => {
  const email = $('#lg-email').value.trim().toLowerCase(), pw = $('#lg-pw').value;
  if(!email || !pw) return loginMsg('Enter your email and password.');
  if(DEMO){
    const m = Local.load().members.find(x => (x.email || '').toLowerCase() === email && x.demo_password);
    if(!m || m.demo_password !== pw) return loginMsg('The email or password isn\'t right.');
    Local.setSession(m.id); history.replaceState(null, '', location.pathname); return reload();
  }
  const {error} = await Remote.sb.auth.signInWithPassword({email, password:pw});
  if(error) return loginMsg('The email or password isn\'t right.');
  history.replaceState(null, '', location.pathname); await reload();
};

A.isMemberSearch = () => {

A.isCopySearch = exact => {

  const books = S.books.filter(b => (b.title + ' ' + (b.author || '')).toLowerCase().includes(ql)).slice(0, 6);
  $('#is-clist').innerHTML = books.length ? books.map(b => {
    const usable = copiesOf(b.id).filter(c => c.status === 'available' || c.status === 'on_hold')
      .sort((x, y) => (holdFor(x.id)?.member_id === IS.memberId ? -1 : x.status === 'available' ? 0 : 1) - (holdFor(y.id)?.member_id === IS.memberId ? -1 : y.status === 'available' ? 0 : 1));
    return usable.length ? `<button type="button" class="pick" onclick="A.isPickCopy('${usable[0].id}')"><b>${esc(b.title)}</b> <span class="muted">${esc(usable[0].code)}, ${esc(locStr(b))}</span></button>`

};

function isRefresh(){
  const m = member(IS.memberId), c = copy(IS.copyId), b = c && book(c.book_id);
  $('#is-mq').hidden = !!m;
  $('#is-crow').hidden = !!c;
  if(m){ const out = memberActive(m.id), od = out.filter(isOverdue).length, f = finesDue(m.id);
    $('#is-msum').innerHTML = `<div class="chosen"><div><b>${esc(m.name)}</b> <span class="muted small">${esc(m.member_code || '')}</span><div class="muted small">${out.length} of ${S.settings.max_books} books with them${od ? `, ${od} overdue` : ''}${f ? `, ${money(f)} late fees due` : ''}, deposit ${money(m.deposit_held)}</div></div><button class="link" type="button" onclick="IS.memberId=null;isRefresh();$('#is-mq').focus()">Change</button></div>`;
  } else $('#is-msum').innerHTML = '';
  $('#is-csum').innerHTML = c ? `<div class="chosen"><div><b>${esc(b ? b.title : '')}</b><div class="muted small">${esc(c.code)} ${statusTag(c.status)}</div></div><button class="link" type="button" onclick="IS.copyId=null;isRefresh();$('#is-cq').focus()">Change</button></div>` : '';
  $('#is-warn').innerHTML = issueWarnings().map(w => `<div class="note ${w.block ? 'bad' : ''}">${w.t}</div>`).join('');
}
function issueWarnings(){
  const w = [], m = member(IS.memberId), c = copy(IS.copyId);
  if(m){
    if(m.status === 'suspended') w.push({block:true, t:`${esc(m.name)}'s membership is suspended.`});
    const out = memberActive(m.id);
    if(out.length >= Number(S.settings.max_books)) w.push({t:`${esc(firstName(m.name))} already has ${out.length} book(s). The limit is ${S.settings.max_books}.`});
    const od = out.filter(isOverdue).length; if(od) w.push({t:`Has ${plural(od, 'overdue book')}.`});
    const f = finesDue(m.id); if(f > 0) w.push({t:`Owes ${money(f)} in late fees.`});
    if(Number(m.deposit_held || 0) < Number(S.settings.deposit_amount || 0)) w.push({t:`Deposit held is ${money(m.deposit_held)}. The membership deposit is ${money(S.settings.deposit_amount)}.`});
    if(c && out.some(l => l.book_id === c.book_id)) w.push({t:'This member already has a copy of this book.'});
  }
  if(c){
    if(c.status === 'issued') w.push({block:true, t:'This copy is already issued. Return it first.'});
    else if(['lost','retired'].includes(c.status)) w.push({block:true, t:`This copy is marked ${c.status}. Change its status on the book page first.`});
    else if(c.status === 'damaged') w.push({t:'This copy is marked damaged.'});
    else if(c.status === 'on_hold'){ const h = holdFor(c.id); if(h && h.member_id !== IS.memberId) w.push({t:`This copy is kept aside for ${esc(member(h.member_id)?.name || 'another member')} until ${fmtDate(holdUntil(h))}. You can still give it to this reader. Their reservation goes back to the waiting list.`}); }
  }
  return w;
}
A.doIssue = async () => {
  const m = member(IS.memberId), c = copy(IS.copyId);
  if(!m) return toast('Choose a member first.', 'bad');
  if(!c) return toast('Choose a book first.', 'bad');
  if(issueWarnings().some(w => w.block)) return toast('This book can’t be issued. See the note in red.', 'bad');
  const due = $('#is-due').value || addDays(today(), S.settings.loan_days);
  const hold = holdFor(c.id);
  const l = await addRow('loans', {copy_id:c.id, book_id:c.book_id, member_id:m.id, issued_at:nowIso(), due_at:due, renewals:0, fine_amount:0, fine_status:'none', lost:false, issued_by:S.me.name});
  await patch('copies', c.id, {status:'issued'});
  await logAct('issued', {m:m.id, b:c.book_id, c:c.id, l:l.id, d:'Due ' + fmtDate(due)});
  const r = S.reservations.find(x => x.member_id === m.id && x.book_id === c.book_id && ['pending','ready'].includes(x.status));
  if(r){
    if(r.status === 'ready' && r.copy_id && r.copy_id !== c.id && copy(r.copy_id)) await patch('copies', r.copy_id, {status:'available'});
    await patch('reservations', r.id, {status:'fulfilled'});
  }
  if(hold && hold.member_id !== m.id) await patch('reservations', hold.id, {status:'pending', copy_id:null, ready_at:null});
  render();
  const b = book(c.book_id);
  openModal('Book issued', `<p><b>${esc(b ? b.title : '')}</b> (${esc(c.code)}) is issued to <b>${esc(m.name)}</b>. Return by <b>${fmtDate(due)}</b>.</p>
    <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Done</button><button class="btn ghost" onclick="A.issueModal({memberId:'${m.id}'})">Issue another book</button>${m.phone ? `<button class="btn wa" onclick="A.sendIssued('${l.id}')">Send due date on WhatsApp</button>` : ''}</div>`);
};

A.doReturn = async lid => {
  const l = loan(lid), m = member(l.member_id);
  const fine = Math.max(0, Number(($('#rt-fine') || {}).value || 0));
  const how = (document.querySelector('input[name=rt-how]:checked') || {}).value || 'cash';
  const cond = $('#rt-cond').value, note = $('#rt-note').value.trim();
  let status = 'none'; if(fine > 0) status = how === 'due' ? 'due' : how === 'waive' ? 'waived' : 'paid';
  if(fine > 0 && how === 'deposit' && Number(m.deposit_held || 0) < fine) return toast(`Only ${money(m.deposit_held)} deposit is held. Choose another way.`, 'bad');
  await patch('loans', lid, {returned_at:nowIso(), fine_amount:fine, fine_status:status, notes:[l.notes, note].filter(Boolean).join(' | ') || null});
  const od = overdueDays({...l, returned_at:null});
  await logAct('returned', {m:m.id, b:l.book_id, c:l.copy_id, l:lid, d:[od ? plural(od, 'day') + ' late' : 'On time', cond === 'damaged' ? 'damaged' : '', note].filter(Boolean).join(', ')});
  if(status === 'paid'){
    await addRow('payments', {member_id:m.id, loan_id:lid, kind:'fine', amount:fine, method:how, recorded_by:S.me.name});
    if(how === 'deposit') await patch('members', m.id, {deposit_held:Number(m.deposit_held || 0) - fine});
    await logAct('fee_paid', {m:m.id, b:l.book_id, l:lid, amt:fine, d:METHOD_LABEL[how]});
  } else if(status === 'due') await logAct('fee_due', {m:m.id, b:l.book_id, l:lid, amt:fine});
  else if(status === 'waived') await logAct('fee_waived', {m:m.id, b:l.book_id, l:lid, amt:fine});
  if(l.copy_id && copy(l.copy_id)) await patch('copies', l.copy_id, {status:cond});
  render();
  const msg = 'Returned' + (fine > 0 ? `. Late fee ${money(fine)} ${status === 'paid' ? 'collected' : status === 'due' ? 'added to dues' : 'waived'}.` : '.');
  const q = pendingFor(l.book_id);
  if(q.length && cond === 'available' && l.copy_id){
    const r = q[0], rm = member(r.member_id);
    openModal('Someone reserved this book', `<p>${esc(msg)}</p><p><b>${esc(rm ? rm.name : 'A member')}</b> reserved <b>${esc(book(l.book_id)?.title || '')}</b>. Keep this copy aside for them until <b>${fmtDate(addDays(today(), S.settings.hold_days))}</b>? If they don't come by then, it goes back on the shelf for anyone.</p>
      <div class="m-actions"><button class="btn ghost" onclick="closeModal()">Not now</button><button class="btn wa" onclick="A.hold('${r.id}','${l.copy_id}')">Keep aside and message them</button></div>`);
  } else { closeModal(); toast(msg); }
};

A.renew = async lid => {
  const l = loan(lid), max = Number(S.settings.max_renewals || 0);
  if((l.renewals || 0) >= max && !confirm(`This loan has been renewed ${l.renewals || 0} time(s). The limit is ${max}. Renew anyway?`)) return;
  if(isOverdue(l) && !confirm(`This book is overdue. Renewing it moves the due date forward and the late fee so far (${money(accruedFine(l))}) won't be charged. Renew anyway?`)) return;
  const waiting = pendingFor(l.book_id).filter(r => r.member_id !== l.member_id);
  if(waiting.length && !confirm(`${plural(waiting.length, 'member')} ${waiting.length === 1 ? 'has' : 'have'} reserved this book. Renew anyway?`)) return;
  const base = daysBetween(today(), l.due_at) > 0 ? l.due_at : today();
  const due = addDays(base, S.settings.renewal_days);
  await patch('loans', lid, {due_at:due, renewals:(l.renewals || 0) + 1});

function copyInputs(n, start){
  return Array.from({length:n}, (_, i) => `<div class="row copy-in"><span class="muted small">Copy ${i + 1}</span><input class="bc" value="${codeFmt(start + i)}" aria-label="Barcode for copy ${i + 1}"><button type="button" class="btn ghost" onclick="scanInto(this.previousElementSibling)" aria-label="Scan the barcode for copy ${i + 1}">📷</button></div>`).join('');
}
function scanInto(el){ Scan.open(c => { el.value = c; }); }
function setCopyRows(boxSel, n){
  const box = $(boxSel), old = [...box.querySelectorAll('.bc')].map(i => i.value);
  box.innerHTML = copyInputs(Math.min(50, Math.max(0, n)), nextCopyNum());
  [...box.querySelectorAll('.bc')].forEach((el, i) => { if(old[i]) el.value = old[i]; });
}
function readCodes(boxSel){
  const codes = [...document.querySelectorAll(boxSel + ' .bc')].map(i => i.value.trim()).filter(Boolean);
  const lower = codes.map(c => c.toLowerCase());
  const dupIn = lower.find((c, i) => lower.indexOf(c) !== i);
  if(dupIn) throw new Error(`The barcode “${dupIn}” is used twice.`);
  const taken = codes.find(c => copyByCode(c)); if(taken) throw new Error(`The barcode “${taken}” is already on another copy.`);
  return codes;
}

/* spreadsheet import */
function parseCSV(text){
  text = text.replace(/^\ufeff/, ''); const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true;
    else if(ch === ','){ row.push(f); f = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
const IMPORT_COLS = ['title','author','category','tags','language','isbn','publisher','room','rack','row','copies','barcodes','description'];

A.importTemplate = () => {
  const ex = ['Miracles Through Pranic Healing','Master Choa Kok Sui','Pranic Healing','healing, beginners','English','','','1','A','2','2','PL-0101|PL-0102','Core textbook of Pranic Healing'];
  download('library-import-template.csv', '\ufeff' + IMPORT_COLS.join(',') + '\n' + ex.map(v => /[",]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v).join(',') + '\n', 'text/csv;charset=utf-8');
};
A.importRead = async file => {
  if(!file) return;
  const rows = parseCSV(await file.text()); if(rows.length < 2) return $('#im-preview').innerHTML = '<div class="note bad">The file has no rows under the header.</div>';
  const head = rows[0].map(h => h.trim().toLowerCase()), ix = k => head.indexOf(k);
  if(ix('title') < 0) return $('#im-preview').innerHTML = '<div class="note bad">The first row must have a column called “title”.</div>';
  const seen = new Set(S.copies.map(c => c.code.toLowerCase())); let next = nextCopyNum(), skipped = 0, regenerated = 0;
  const books = [];
  rows.slice(1).forEach(r => {
    const g = k => (ix(k) >= 0 ? (r[ix(k)] || '') : '').trim();
    if(!g('title')){ skipped++; return; }
    const given = g('barcodes').split('|').map(s => s.trim()).filter(Boolean);
    const n = Math.max(parseInt(g('copies'), 10) || 0, given.length, g('copies') === '' && !given.length ? 1 : 0);
    const codes = [];
    for(let i = 0; i < n; i++){
      let c = given[i];
      if(c && seen.has(c.toLowerCase())){ regenerated++; c = ''; }
      if(!c){ while(seen.has(codeFmt(next).toLowerCase())) next++; c = codeFmt(next++); }
      seen.add(c.toLowerCase()); codes.push(c);
    }
    books.push({book:{id:uid(), title:g('title'), author:g('author') || null, category:g('category') || null, tags:uniq(g('tags').split(',').map(s => s.trim()).filter(Boolean)), language:g('language') || null, isbn:g('isbn') || null, publisher:g('publisher') || null, room:g('room') || null, rack:g('rack') || null, row_no:g('row') || null, description:g('description') || null, cover_url:null}, codes});
  });
  IMPORT = books;
  const nCopies = books.reduce((s, b) => s + b.codes.length, 0);
  $('#im-preview').innerHTML = `<div class="note info">Ready to add <b>${plural(books.length, 'book')}</b> with <b>${plural(nCopies, 'copy', 'copies')}</b>.${skipped ? ` ${plural(skipped, 'row')} without a title will be skipped.` : ''}${regenerated ? ` ${plural(regenerated, 'barcode')} already in use got a new code.` : ''}</div>
    <div class="tbl-wrap" style="max-height:240px;overflow:auto"><table class="tbl"><thead><tr><th>Title</th><th>Author</th><th>Location</th><th>Barcodes</th></tr></thead><tbody>${books.slice(0, 50).map(x => `<tr><td>${esc(x.book.title)}</td><td>${esc(x.book.author || '')}</td><td>${esc(locStr(x.book))}</td><td class="small">${esc(x.codes.join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
  $('#im-go').disabled = !books.length;
};
A.importRun = async () => {
  if(!IMPORT || !IMPORT.length) return;
  $('#im-go').disabled = true; $('#im-go').textContent = 'Importing…';
  for(let i = 0; i < IMPORT.length; i += 200){
    const chunk = IMPORT.slice(i, i + 200);
    await addRows('books', chunk.map(x => x.book));
    await addRows('copies', chunk.flatMap(x => x.codes.map(code => ({book_id:x.book.id, code, status:'available'}))));
  }
  const n = IMPORT.length; await logAct('import', {d:plural(n, 'book') + ' from a spreadsheet'}); IMPORT = null;
  closeModal(); go('catalog'); toast(`Imported ${plural(n, 'book')}.`);
};

   CAMERA SCANNER (QR codes and barcodes)
   ========================================================= */
const Scan = {
  q:null, cb:null, busy:false,
  async open(cb){
    this.cb = cb; this.busy = false; $('#scan-manual').value = ''; $('#scan-msg').textContent = 'Starting the camera…';
    $('#scanner').showModal();
    try {
      if(!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
      this.q = new Html5Qrcode('scan-region');
      await this.q.start({facingMode:'environment'}, {fps:10, qrbox:(w, h) => { const s = Math.min(w, h); return {width:Math.floor(s * .85), height:Math.floor(s * .55)}; }}, t => this.done(t), () => {});
      $('#scan-msg').textContent = 'Hold the QR code or barcode inside the box.';
    } catch(e){ $('#scan-msg').textContent = 'The camera could not start (' + ((e && e.message) || e) + '). Type the code below instead.'; }
  },
  async done(text){ if(this.busy) return; this.busy = true; const cb = this.cb; await this.stop(); if($('#scanner').open) $('#scanner').close(); if(cb) cb(String(text).trim()); },
  manual(){ const v = $('#scan-manual').value.trim(); if(v) this.done(v); },
  async stop(){ try { if(this.q){ if(this.q.isScanning) await this.q.stop(); this.q.clear(); } } catch(e) {} this.q = null; },
  async close(){ await this.stop(); if($('#scanner').open) $('#scanner').close(); },
};

async function loadAll(){
  const [settings, ...lists] = await Promise.all([DB.getSettings(), ...TABLES.map(t => DB.list(t))]);
  S.settings = {...DEFAULT_SETTINGS, ...stripNull(settings)};
  TABLES.forEach((t, i) => { S[t] = lists[i]; });
}
async function reload(){
  S.noProfile = false; S.availMap = null;
  if(DEMO){
    await loadAll(); const sid = Local.getSession(); S.me = sid ? member(sid) || null : null;
  } else {
    const {data} = await Remote.sb.auth.getSession(); S.session = data.session;
    S.settings = {...DEFAULT_SETTINGS, ...stripNull(await Remote.getSettings())};
    S.me = null;
    if(S.session){
      if(await Remote.rpc('is_staff')){ await loadAll(); S.me = S.members.find(m => m.auth_user_id === S.session.user.id) || null; }
      else {
        const prof = await Remote.rpc('my_profile');
        if(prof){
          const [books, copies, loans, reservations, avail] = await Promise.all([Remote.list('books'), Remote.list('copies'), Remote.list('loans'), Remote.list('reservations'), Remote.rpc('book_availability')]);
          Object.assign(S, {books, copies, loans, reservations, payments:[], activity:[], members:[prof], me:prof});
          S.availMap = Object.fromEntries((avail || []).map(a => [a.book_id, a]));
        } else S.noProfile = true;
      }
    }
  }
  if(isStaff()) await expireHolds();
  document.title = S.settings.library_name;
  render();
}
async function boot(){
  $('#modal').addEventListener('click', e => { if(e.target === e.currentTarget) closeModal(); });
  $('#scanner').addEventListener('close', () => Scan.stop());
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  try { if(!DEMO) Remote.init(); await reload(); }
  catch(e){
    console.error(e);
    $('#app').innerHTML = `<div class="fatal"><h2>The library could not open</h2><p>${esc((e && e.message) || e)}</p><p class="muted small">If you just connected Supabase, check that the URL and anon key at the top of index.html are correct and that you ran the setup SQL.</p></div>`;
  }
}
boot();
